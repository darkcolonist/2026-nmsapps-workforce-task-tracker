<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Rounded Dark Slate Background -->
  <rect width="64" height="64" rx="14" fill="#0f172a"/>
  <rect x="2" y="2" width="60" height="60" rx="12" stroke="#1e293b" stroke-width="2"/>

  <!-- Subtle Grid Lines -->
  <line x1="12" y1="20" x2="52" y2="20" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="12" y1="32" x2="52" y2="32" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="12" y1="44" x2="52" y2="44" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Blue Area Fill under Burndown Trajectory -->
  <path d="M12 18 L25 24 L38 35 L52 46 L52 50 L12 50 Z" fill="#3b82f6" fill-opacity="0.18"/>

  <!-- Emerald Cumulative Done Line (Dashed) -->
  <path d="M12 46 L25 39 L38 27 L52 16" stroke="#10b981" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 5"/>

  <!-- Blue Burndown Remaining Line -->
  <path d="M12 18 L25 24 L38 35 L52 46" stroke="#3b82f6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Key Data Nodes -->
  <circle cx="12" cy="18" r="3.5" fill="#60a5fa" stroke="#0f172a" stroke-width="1.5"/>
  <circle cx="38" cy="35" r="3.5" fill="#60a5fa" stroke="#0f172a" stroke-width="1.5"/>
  <circle cx="52" cy="46" r="4" fill="#3b82f6" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="52" cy="16" r="3.5" fill="#34d399" stroke="#0f172a" stroke-width="1.5"/>
</svg>
